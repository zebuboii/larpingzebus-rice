include themes/Matugen.conf


# Cursor trail
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2


# Background opacity
background_opacity 0.75
dynamic_background_opacity yes
allow_remote_control yes

# Font
font_family family='JetBrains Mono' variable_name=JetBrainsMonoRoman style=JetBrainsMonoRoman-Regular
bold_font auto
italic_font auto
bold_italic_font auto

# BEGIN_KITTY_THEME
# Matugen
# END_KITTY_THEME
